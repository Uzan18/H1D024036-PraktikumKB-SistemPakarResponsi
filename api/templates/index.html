<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pakar - Konsentrasi IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">IT Concentration Expert System</h1>
            <p class="text-indigo-100 mt-2">Sistem Pakar Forward Chaining penentu studi Informatika</p>
        </div>

        <div class="p-8">
            <!-- Quiz Container -->
            <div id="quiz-container">
                <div class="mb-8">
                    <span class="text-sm font-semibold text-indigo-600 uppercase tracking-wider" id="question-counter">Pertanyaan 1 / 8</span>
                    <h2 class="text-xl font-medium text-gray-800 mt-2" id="question-text">Loading...</h2>
                </div>
                
                <div class="space-y-4">
                    <button onclick="answer(true)" class="w-full py-3 px-6 text-left rounded-xl border-2 border-gray-200 hover:border-indigo-600 hover:bg-indigo-50 transition duration-200 font-medium text-gray-700 flex justify-between items-center group">
                        Ya, saya setuju
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                    <button onclick="answer(false)" class="w-full py-3 px-6 text-left rounded-xl border-2 border-gray-200 hover:border-red-500 hover:bg-red-50 transition duration-200 font-medium text-gray-700 flex justify-between items-center group">
                        Tidak setuju
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Result Container -->
            <div id="result-container" class="hidden text-center fade-in">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mb-6">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Hasil Analisis Forward Chaining</h2>
                <p class="text-gray-600 mb-6">Berdasarkan fakta-fakta yang Anda masukkan, konsentrasi studi yang paling tepat adalah:</p>
                
                <div class="p-6 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl text-white shadow-lg mb-8 transform hover:scale-105 transition duration-300">
                    <span id="final-result" class="text-3xl font-bold tracking-wide">...</span>
                </div>

                <button onclick="location.reload()" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200">
                    Mulai Ulang Tes
                </button>
            </div>
        </div>
    </div>

    <script>
        // Knowledge Base: Pertanyaan yang akan menjadi "Fakta" jika dijawab Ya.
        const questions = [
            { id: 'suka_ngoding', text: 'Apakah kamu sangat suka menulis kode (ngoding) dan memecahkan masalah logika?' },
            { id: 'suka_arsitektur', text: 'Apakah kamu suka merancang arsitektur sistem dan membangun perangkat lunak utuh?' },
            { id: 'suka_matematika', text: 'Apakah kamu unggul dan tertarik pada perhitungan matematika serta statistik?' },
            { id: 'pengolahan_data', text: 'Apakah kamu tertarik untuk menganalisis dan mengolah data dalam jumlah besar?' },
            { id: 'suka_hardware', text: 'Apakah kamu suka mengotak-atik perangkat keras (hardware) komputer?' },
            { id: 'keamanan_server', text: 'Apakah kamu tertarik dengan sistem jaringan dan mengamankan server (Cyber Security)?' },
            { id: 'suka_desain', text: 'Apakah kamu memiliki ketertarikan kuat pada desain visual dan estetika?' },
            { id: 'peduli_ux', text: 'Apakah kamu sangat peduli dengan kemudahan pengguna (User Experience) saat memakai aplikasi?' }
        ];

        let currentQuestionIndex = 0;
        let collectedFacts = []; // Menyimpan ID fakta yang bernilai True

        function renderQuestion() {
            if (currentQuestionIndex < questions.length) {
                document.getElementById('question-counter').innerText = `Pertanyaan ${currentQuestionIndex + 1} / ${questions.length}`;
                document.getElementById('question-text').innerText = questions[currentQuestionIndex].text;
            } else {
                // Jika pertanyaan habis, jalankan proses Forward Chaining ke backend
                submitFacts();
            }
        }

        function answer(isYes) {
            if (isYes) {
                // Jika Yes, catat sebagai Fakta
                collectedFacts.push(questions[currentQuestionIndex].id);
            }
            currentQuestionIndex++;
            renderQuestion();
        }

        async function submitFacts() {
            // Sembunyikan quiz, tampilkan loading (opsional)
            document.getElementById('quiz-container').classList.add('hidden');
            
            try {
                // Fetch API untuk komunikasi mulus ke backend Flask tanpa reload halaman
                const response = await fetch('/api/diagnose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ facts: collectedFacts })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Tampilkan Hasil
                    document.getElementById('final-result').innerText = data.result;
                    document.getElementById('result-container').classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Terjadi kesalahan komunikasi dengan server. Pastikan server Flask berjalan.");
            }
        }

        // Mulai kuis pertama kali halaman diload
        renderQuestion();
    </script>
</body>
</html>
